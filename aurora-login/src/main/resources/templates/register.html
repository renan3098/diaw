<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar conta - Aurora Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="aurora-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="auth-card">
        <div class="brand">
            <div class="brand-logo">🔐</div>
            <div class="brand-name">Aurora</div>
        </div>
        <h1>Criar conta</h1>
        <p class="auth-subtitle">Leva menos de um minuto</p>

        <form th:action="@{/register}" th:object="${registerForm}" method="post">

            <div class="form-group">
                <label for="username">Usuário</label>
                <div class="input-wrapper">
                    <span class="icon">👤</span>
                    <input type="text" id="username" th:field="*{username}" placeholder="ex: rodrigo.dev">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></div>
            </div>

            <div class="form-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <span class="icon">📧</span>
                    <input type="text" id="email" th:field="*{email}" placeholder="voce@exemplo.com">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" th:field="*{password}" placeholder="mínimo 6 caracteres">
                    <button type="button" class="toggle-password" data-target="password">Mostrar</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar senha</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="repita a senha">
                    <button type="button" class="toggle-password" data-target="confirmPassword">Mostrar</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn-primary">Criar conta</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/login}">← Voltar para o login</a>
        </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
