<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Aurora Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="aurora-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="auth-card">
        <div class="brand">
            <div class="brand-logo">🔐</div>
            <div class="brand-name">Aurora</div>
        </div>
        <h1>Bem-vindo de volta</h1>
        <p class="auth-subtitle">Entre com sua conta para continuar</p>

        <div class="alert alert-error" th:if="${loginError}" th:text="${loginError}"></div>
        <div class="alert alert-success" th:if="${logoutMessage}" th:text="${logoutMessage}"></div>
        <div class="alert alert-success" th:if="${registeredMessage}" th:text="${registeredMessage}"></div>

        <form th:action="@{/login}" method="post">

            <div class="form-group">
                <label for="usernameOrEmail">Usuário ou email</label>
                <div class="input-wrapper">
                    <span class="icon">👤</span>
                    <input type="text" id="usernameOrEmail" name="usernameOrEmail"
                           placeholder="seu.usuario ou email@exemplo.com" required autofocus>
                </div>
            </div>

            <div class="form-group">
                <label for="password">Senha</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" name="password" placeholder="••••••••" required>
                    <button type="button" class="toggle-password" data-target="password">Mostrar</button>
                </div>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/recoverpassword}">Esqueci minha senha</a>
            <span>Não tem conta? <a th:href="@{/register}">Cadastre-se</a></span>
        </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
