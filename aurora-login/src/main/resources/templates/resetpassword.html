<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redefinir senha - Aurora Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="aurora-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="auth-card">
        <div class="brand">
            <div class="brand-logo">🔐</div>
            <div class="brand-name">Aurora</div>
        </div>
        <h1>Definir nova senha</h1>

        <div th:if="${tokenInvalido}">
            <div class="alert alert-error">
                Este link de recuperação é inválido ou já expirou.
            </div>
            <div class="auth-links">
                <a th:href="@{/recoverpassword}">Solicitar um novo link</a>
            </div>
        </div>

        <form th:unless="${tokenInvalido}" th:action="@{/resetpassword}" th:object="${resetPasswordForm}" method="post">

            <input type="hidden" th:field="*{token}">

            <div class="form-group">
                <label for="password">Nova senha</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="password" th:field="*{password}" placeholder="mínimo 6 caracteres">
                    <button type="button" class="toggle-password" data-target="password">Mostrar</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirmar nova senha</label>
                <div class="input-wrapper">
                    <span class="icon">🔒</span>
                    <input type="password" id="confirmPassword" th:field="*{confirmPassword}" placeholder="repita a nova senha">
                    <button type="button" class="toggle-password" data-target="confirmPassword">Mostrar</button>
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
            </div>

            <button type="submit" class="btn-primary">Salvar nova senha</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/login}">← Voltar para o login</a>
        </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
