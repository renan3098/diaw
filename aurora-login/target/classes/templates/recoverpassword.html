<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha - Aurora Login</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

    <div class="aurora-background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
    </div>

    <main class="auth-card">
        <div class="brand">
            <div class="brand-logo">🔐</div>
            <div class="brand-name">Aurora</div>
        </div>
        <h1>Recuperar senha</h1>
        <p class="auth-subtitle">Informe seu email para receber as instruções</p>

        <div class="alert alert-success" th:if="${successMessage}" th:text="${successMessage}"></div>

        <form th:action="@{/recoverpassword}" th:object="${recoverPasswordForm}" method="post">

            <div class="form-group">
                <label for="email">Email cadastrado</label>
                <div class="input-wrapper">
                    <span class="icon">📧</span>
                    <input type="text" id="email" th:field="*{email}" placeholder="voce@exemplo.com">
                </div>
                <div class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
            </div>

            <button type="submit" class="btn-primary">Enviar instruções</button>
        </form>

        <div class="auth-links">
            <a th:href="@{/login}">← Voltar para o login</a>
        </div>
    </main>

    <script th:src="@{/js/app.js}"></script>
</body>
</html>
