spring.application.name=aurora-login

# ---------------------------------------------------------------------------
# Banco de dados (H2 em memoria - suficiente para a atividade).
# Os dados sao perdidos a cada reinicio da aplicacao.
# Console disponivel em http://localhost:8080/h2-console (JDBC URL abaixo)
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:auroradb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Nao usar cache de templates em desenvolvimento (facilita ver mudancas no HTML)
spring.thymeleaf.cache=false

server.port=8080

# ---------------------------------------------------------------------------
# Envio de email (recuperacao de senha - funcionalidade opcional).
#
# IMPORTANTE: nenhuma credencial real fica no codigo-fonte. Os valores reais
# devem vir de VARIAVEIS DE AMBIENTE na maquina/servidor onde a aplicacao
# roda - nunca digitados diretamente aqui.
#
# Por padrao app.mail.enabled=false, entao o link de recuperacao so aparece
# no console/log (modo simulacao), sem precisar configurar SMTP nenhum.
# ---------------------------------------------------------------------------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.enabled=${MAIL_ENABLED:false}
app.base-url=${APP_BASE_URL:http://localhost:8080}
